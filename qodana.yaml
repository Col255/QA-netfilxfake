version: "1.0"
linter: jetbrains/qodana-php:2025.1
failThreshold: 50
include:
  - name: PhpDeprecationInspection
  - name: PhpSecurityInspection
exclude:
  - name: All
    paths:
      - netfix2/uploads
      - netfix2/images
      - node_modules
      - Postman
      - tests
      - backup_before_update