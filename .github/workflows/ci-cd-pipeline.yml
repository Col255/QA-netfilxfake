name: QA Pipeline - Qodana Scan & Docker Version Build

on:
  push:
    branches: [ main, week2 ]
  pull_request:
    branches: [ main ]

jobs:
  # BƯỚC 1: QUÉT CHẤT LƯỢNG CODE BẰNG QODANA
  code-quality-scan:
    name: Qodana Code Quality Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2024.3
        continue-on-error: true
        with:
          args: --fail-threshold,100   

  # BƯỚC 2: BUILD DOCKER VÀ QUẢN LÝ VERSION TRÊN DOCKER HUB
  docker-build-and-push:
    name: Build & Push Versioned Docker Image
    needs: code-quality-scan
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Docker Image có gắn Version
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netfix2-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/netfix2-app:v1.0.${{ github.run_number }}