name: QA Pipeline - Static (SonarQube & Qodana) + Dynamic (CodeceptJS) + Docker Hub

on:
  push:
    branches: [ main, 'week*' ]
  pull_request:
    branches: [ main, 'week*' ]

jobs:
  # =========================================================================
  # BƯỚC 1A: KIỂM THỬ TĨNH VỚI SONARQUBE CLOUD (STATIC TESTING 1)
  # =========================================================================
  sonarqube-static-scan:
    name: 1A. Static Test - SonarQube Scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kiểm tra cú pháp PHP (PHP Syntax Lint)
        run: |
          find netfix2 -type f -name "*.php" -exec php -l {} +

      - name: SonarQube Cloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Nhắc nhở nếu chưa thêm SONAR_TOKEN
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::warning title=Chưa có SONAR_TOKEN::Hãy thêm SONAR_TOKEN vào GitHub Secrets để gửi báo cáo lên SonarQube Cloud."

  # =========================================================================
  # BƯỚC 1B: KIỂM THỬ TĨNH VỚI JETBRAINS QODANA (STATIC TESTING 2)
  # =========================================================================
  qodana-static-scan:
    name: 1B. Static Test - Qodana Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_646815503 || secrets.QODANA_TOKEN }}
      QODANA_ENDPOINT: 'https://qodana.cloud'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qodana Code Quality Scan
        if: env.QODANA_TOKEN != ''
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
          args: --fail-threshold,100

      - name: Nhắc nhở nếu chưa thêm QODANA_TOKEN
        if: env.QODANA_TOKEN == ''
        run: |
          echo "::warning title=Chưa có QODANA_TOKEN::Hãy thêm QODANA_TOKEN vào GitHub Secrets để chạy Qodana Cloud."

  # =========================================================================
  # BƯỚC 2: KIỂM THỬ ĐỘNG VỚI CODECEPTJS + PLAYWRIGHT (DYNAMIC E2E TESTING)
  # =========================================================================
  codeceptjs-dynamic-test:
    name: 2. Dynamic Test - CodeceptJS E2E (PHP + MySQL)
    needs: [sonarqube-static-scan, qodana-static-scan]
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: netfixvn
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Cài đặt PHP 8.2 và MySQLi Extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, pdo, pdo_mysql, mbstring

      - name: Import Database mẫu (database/netfixvn.sql) vào MySQL
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot netfixvn < database/netfixvn.sql

      - name: Khởi chạy Web Server PHP (chạy ngầm)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: netfixvn
          DB_USER: root
          DB_PASS: root
        run: |
          php -S 127.0.0.1:8000 -t . > php-server.log 2>&1 &
          sleep 2
          curl -I http://127.0.0.1:8000/netfix2/login.php

      - name: Cài đặt Node.js & Thư viện CodeceptJS + Playwright
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt Dependencies và Trình duyệt Chromium
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Chạy Kiểm thử Động CodeceptJS
        env:
          CI: 'true'
          BASE_URL: 'http://127.0.0.1:8000/netfix2'
        run: |
          npx codeceptjs run --steps

      - name: Lưu ảnh chụp màn hình lỗi (nếu Test Fail) để gắn vào Jira Bug
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-failure-screenshots
          path: output/

  # =========================================================================
  # BƯỚC 3: ĐÓNG GÓI & ĐẨY LÊN DOCKER HUB (CHỈ CHẠY KHI TĨNH & ĐỘNG ĐỀU PASS)
  # =========================================================================
  docker-build-and-push:
    name: 3. Release - Build & Push Docker Hub
    needs: [sonarqube-static-scan, qodana-static-scan, codeceptjs-dynamic-test]
    if: success() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build và Push Docker Image có gắn Version
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netfix2-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/netfix2-app:v1.0.${{ github.run_number }}
